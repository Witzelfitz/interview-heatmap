[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-heatmap"
version = "0.1.0"
description = "Lokale Interview-Heatmap und Schnitt-Advisor"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1,<2", "numpy>=1.26,<3", "scipy>=1.12,<2",
  "soundfile>=0.12,<1", "librosa>=0.10.2,<1", "PyYAML>=6,<7",
  "psutil>=5.9,<8", "jsonschema>=4.23,<5", "av>=11,<18",
]

[project.scripts]
interview-heatmap = "heatmap:main"
interview-heatmap-server = "server:main"

[project.optional-dependencies]
diarization = ["pyannote.audio>=4,<5"]
remote = ["openai>=1.60,<3"]
claude = ["anthropic>=0.84,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9", "playwright>=1.50"]

[tool.setuptools]
py-modules = ["heatmap", "server"]
packages = ["pipeline"]

[tool.setuptools.data-files]
"share/interview-heatmap" = ["config.yaml"]
"share/interview-heatmap/templates" = ["templates/report.html", "templates/upload.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
